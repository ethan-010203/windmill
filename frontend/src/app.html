<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/logo.svg" />
		<style type="text/css">
			.st2 {
				fill: #bcd4fc;
			}

			.st3 {
				fill: #3b82f6;
			}

			/* Background color for dark mode */
			@media (prefers-color-scheme: dark) {
				#mainbg {
					background-color: #3b4252; /* Example: dark gray background for dark mode */
				}
				#loading-text {
					color: #a8aeb7 !important;
				}
			}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-code="viewport" class="outline-none focus:outline-none">
		<div style="display: contents">
			<div id="svelte-global-loader">
				<div id="mainbg" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100vh">
				</div>

				<div style="position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%)">
					<svg
						version="1.1"
						id="internal-tool-logo"
						xmlns="http://www.w3.org/2000/svg"
						x="0px"
						y="0px"
						width="128px"
						height="128px"
						viewBox="0 0 256 256"
					>
						<rect x="24" y="24" width="208" height="208" rx="48" class="st3" />
						<path
							d="M78 94h100M78 128h100M78 162h64"
							fill="none"
							stroke="#fff"
							stroke-width="18"
							stroke-linecap="round"
						/>
						<circle cx="78" cy="94" r="12" fill="#fff" />
						<circle cx="78" cy="128" r="12" fill="#fff" />
						<circle cx="78" cy="162" r="12" fill="#fff" />
					</svg>
					<div
						id="loading-text"
						style="
							text-align: center;
							margin-top: 30px;
							color: gray;
							font-family: Arial, Helvetica, sans-serif;
						"
					>
						加载中...
					</div>
				</div>
			</div>
			%sveltekit.body%
		</div>
	</body>
</html>
