services:
  postgres:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME:-internal-platform}-postgres
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windmill"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  windmill_server:
    image: ${WINDMILL_IMAGE:-internal-platform:ce-source}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODE: server
      BASE_URL: ${BASE_URL}
      WM_BASE_URL: ${WM_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SECRET_SALT: ${SECRET_KEY}
      JWT_SECRET: ${SECRET_KEY}
      SUPERADMIN_SECRET: ${SUPERADMIN_SECRET:-}
      CREATE_WORKSPACE_REQUIRE_SUPERADMIN: ${CREATE_WORKSPACE_REQUIRE_SUPERADMIN:-false}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - worker_logs:/tmp/windmill/logs
    ports:
      - "${APP_PORT:-8000}:8000"

  windmill_worker:
    image: ${WINDMILL_IMAGE:-internal-platform:ce-source}
    restart: unless-stopped
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      windmill_server:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODE: worker
      BASE_URL: ${BASE_URL}
      WM_BASE_URL: ${WM_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SECRET_SALT: ${SECRET_KEY}
      JWT_SECRET: ${SECRET_KEY}
      WORKER_GROUP: default
      NUM_WORKERS: ${NUM_WORKERS:-2}
      FAVOR_UNSHARE_PID: ${FAVOR_UNSHARE_PID:-true}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs

  windmill_worker_native:
    image: ${WINDMILL_IMAGE:-internal-platform:ce-source}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      windmill_server:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODE: worker
      BASE_URL: ${BASE_URL}
      WM_BASE_URL: ${WM_BASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SECRET_SALT: ${SECRET_KEY}
      JWT_SECRET: ${SECRET_KEY}
      WORKER_GROUP: native
      NATIVE_MODE: true
      SLEEP_QUEUE: 200
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - worker_logs:/tmp/windmill/logs

volumes:
  postgres_data:
  worker_dependency_cache:
  worker_logs:
